name: PHPUnit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        # Match phpunit.xml (jorsastech_test, root, empty password) so the test
        # run — whose DB config comes from phpunit.xml, not .env — can connect.
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: jorsastech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL
        run: until mysql -h127.0.0.1 -uroot -e "select 1"; do sleep 1; done

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: jorsastech_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --no-interaction --force

      # phpunit.xml supplies the test DB config (jorsastech_test/root/empty) and
      # the Feature suite; RefreshDatabase migrates a fresh schema per run.
      - name: Run tests
        run: ./vendor/bin/phpunit --testdox
